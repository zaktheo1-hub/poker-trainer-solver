[package]
name = "poker-trainer-solver"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Offline batch solver for the Poker Trainer postflop library"

[dependencies]
# Pinned: upstream development was suspended in 2023. The file-IO feature (bincode) no
# longer builds against current bincode releases and is not needed here.
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
